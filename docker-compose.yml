# Optional `.env` next to this file (`cp .env.example .env`). Empty values
# boot the UI; add keys later in Réglages, or in `.env` then rebuild.
# Do not add `env_file: .env` — Compose errors if that file is missing.
# Locate the files: `npm run where-env` or `sh scripts/where-env.sh`
services:
  thumbgen:
    build:
      context: .
      args:
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
        SITE_PASSWORD: ${SITE_PASSWORD:-}
    container_name: thumbgen
    # Long-lived `node server.js`. Keep this container up: followed-channel RSS
    # + young-video snapshots run on an in-process 15 min timer (no cron).
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
