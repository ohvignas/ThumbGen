services:
  thumbgen:
    build:
      context: .
      args:
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
        SITE_PASSWORD: ${SITE_PASSWORD:-}
    container_name: thumbgen
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - SITE_PASSWORD=${SITE_PASSWORD:-}
